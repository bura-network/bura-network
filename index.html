<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Network — Klasik Survival</title>
<style>
/* Kırmızı ve Siyah Ağır Basan Koyu Tema (Varsayılan) */
:root {
  --bg-color: #080606;
  --card-bg: #120a0a;
  --card-border: rgba(220, 38, 38, 0.15);
  --primary: #ef4444;
  --primary-hover: #dc2626;
  --accent: #f87171;
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --header-bg: rgba(8, 6, 6, 0.95);
  --sidebar-card: #120a0a;
  --badge-bg: rgba(239, 68, 68, 0.15);
}

/* Kırmızı & Siyah Açık Tema */
body.light-theme {
  --bg-color: #f8fafc;
  --card-bg: #ffffff;
  --card-border: rgba(220, 38, 38, 0.12);
  --primary: #dc2626;
  --primary-hover: #b91c1c;
  --accent: #ef4444;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --header-bg: rgba(255, 255, 255, 0.95);
  --sidebar-card: #ffffff;
  --badge-bg: rgba(220, 38, 38, 0.1);
}

/* Tamamen Koyu & Kan Kırmızı Tema */
body.dark-red-theme {
  --bg-color: #030303;
  --card-bg: #0d0404;
  --card-border: rgba(239, 68, 68, 0.25);
  --primary: #b91c1c;
  --primary-hover: #991b1b;
  --accent: #ef4444;
  --text-main: #fff1f2;
  --text-muted: #9ca3af;
  --header-bg: rgba(3, 3, 3, 0.95);
  --sidebar-card: #0d0404;
  --badge-bg: rgba(185, 28, 28, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: background 0.2s, color 0.2s, border-color 0.2s; }
body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

/* Üst Duyuru Bandı (Kırmızı-Siyah Gradyan) */
.top-banner {
  background: linear-gradient(90deg, #120a0a, var(--primary), #120a0a);
  color: #fff;
  text-align: center;
  padding: 8px 15px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;
  border-bottom: 1px solid rgba(239, 68, 68, 0.3);
}

/* Navigasyon / Header */
header {
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5%;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 0.5px;
  color: var(--text-main);
  text-decoration: none;
}
.logo-area span { color: var(--primary); text-shadow: 0 0 10px rgba(239,68,68,0.4); }

.nav-links {
  display: flex;
  gap: 25px;
  align-items: center;
}
.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.theme-toggle {
  background: var(--badge-bg);
  border: 1px solid var(--card-border);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}
.theme-toggle:hover { filter: brightness(1.2); }

/* Ana İçerik Konteynerı */
.container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
  width: 100%;
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 30px;
  flex: 1;
}

/* Sol Kategori Menüsü */
aside {
  display: flex;
  flex-direction: column;
  gap: 15px;
